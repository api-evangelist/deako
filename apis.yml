aid: deako
name: Deako
description: 'Deako is a whole-home smart lighting company that designs modular smart switches,
  dimmers, plugs, and simple switches (motion, timer, nightlight, and fan controls) for
  residential new construction and retrofit. Its Deako Intelligence platform layers adaptive
  lighting, follow-me sound, intercom, and parent-care features on top of the hardware, and
  the devices integrate with Amazon Alexa, Google Home, Control4, Clare, and the Matter
  smart-home standard. Deako sells directly and through a network of homebuilders,
  electricians, and integrators. No public developer API, SDK, or developer portal is
  currently published; this profile tracks the company''s public web, support, blog, legal,
  and smart-home integration surface, awaiting any future developer program.'
